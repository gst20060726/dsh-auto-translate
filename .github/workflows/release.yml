name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Sanity check
        run: |
          node --check index.js
          node --check client.js
          node --check vendor/worker.v4.js
          node -e "const p=require('./package.json');if(!p.dsh||!p.dsh.bundle||!p.dsh.client){throw new Error('missing dsh manifest')};console.log('manifest ok:',p.name,p.version)"

      - name: Offline tests (contract + i18n completeness)
        run: npm test

      - name: Package dry-run
        run: npm pack --dry-run

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
