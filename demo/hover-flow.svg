<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Hover a block for 0.6s to translate it in place; hover again to restore the original.">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif; }
      .lbl { font-size: 12px; fill: #6b7280; }
      .h { font-size: 13.5px; font-weight: 600; fill: #111827; }
      .body { font-size: 13.5px; fill: #1f2937; }
      .dim { font-size: 12px; fill: #9ca3af; }
      .pill { font-size: 11.5px; fill: #374151; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .bubble { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 1; }
      .bar { fill: #e5e7eb; }
      .hl { fill: #4d6bfe; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="371" rx="14" class="card"/>

  <text x="20" y="30" class="t h">Hover a block → translated in place</text>
  <text x="20" y="49" class="t lbl">dsh-auto-translate · display-layer, on demand — the page is never auto-translated</text>

  <!-- Panel A: original -->
  <text x="20" y="82" class="t lbl">1 · original (English)</text>
  <rect x="20" y="90" width="380" height="176" rx="10" class="bubble"/>
  <rect x="36" y="106" width="64" height="8" rx="4" class="bar"/>
  <rect x="108" y="106" width="150" height="8" rx="4" class="bar"/>
  <rect x="36" y="128" width="330" height="8" rx="4" class="bar"/>
  <rect x="36" y="150" width="286" height="8" rx="4" class="bar"/>
  <rect x="36" y="184" width="332" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="48" y="203" class="t body">The plan is ready — I refactored</text>
  <text x="48" y="220" class="t body">the parser and added tests.</text>

  <!-- cursor + hover badge -->
  <path d="M296 236 l0 20 l5 -5 l3.5 8 l4 -2 l-3.5 -8 l7 -0.5z" fill="#111827" stroke="#ffffff" stroke-width="1"/>
  <rect x="316" y="232" width="76" height="22" rx="11" fill="#111827"/>
  <text x="330" y="247" class="t pill" fill="#ffffff">hover ~0.6s</text>

  <!-- arrow -->
  <path d="M410 178 h24" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M434 178 l-7 -4.5 v9z" fill="#9ca3af"/>
  <circle cx="462" cy="178" r="15" fill="#4d6bfe"/>
  <text x="455.5" y="183" class="t" font-size="15" fill="#ffffff">译</text>

  <!-- Panel B: translated -->
  <text x="478" y="82" class="t lbl">2 · after hovering (in place)</text>
  <rect x="478" y="90" width="382" height="176" rx="10" class="bubble"/>
  <rect x="494" y="106" width="64" height="8" rx="4" class="bar"/>
  <rect x="566" y="106" width="150" height="8" rx="4" class="bar"/>
  <rect x="494" y="128" width="330" height="8" rx="4" class="bar"/>
  <rect x="494" y="150" width="286" height="8" rx="4" class="bar"/>
  <rect x="494" y="184" width="334" height="44" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="506" y="203" class="t body">方案已就绪 —— 我重构了解析器，</text>
  <text x="506" y="220" class="t body">并补上了测试。</text>
  <text x="494" y="250" class="t dim">hover again → restore the original · 再停一次换回原文</text>

  <!-- bottom pills -->
  <rect x="20" y="288" width="180" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="36" y="307" class="t pill">① hover 0.6s · 悬停</text>
  <rect x="210" y="288" width="196" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="226" y="307" class="t pill">② swap in place · 就地替换</text>
  <rect x="416" y="288" width="222" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="432" y="307" class="t pill">③ hover again · 换回原文</text>

  <text x="20" y="348" class="t dim">Selection works too: drag-select text, release → popup (copyable) or in-place, your choice.</text>
  <text x="20" y="364" class="t dim">Zero token · no model call · text never leaves your machine (local WASM engine).</text>
</svg>
